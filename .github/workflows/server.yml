name: Выкатка сервера покера

# Слияние в main → тесты → сервер комнат на Cloudflare (server/, Р-18).
# Ключи — секреты репо CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID; нет их —
# выкатка пропускается, тесты идут. Откат — Cloudflare → Workers → fishki-poker →
# Deployments → Rollback. Пароль компании ROOM_PASSWORD ставится в панели Cloudflare.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/poker/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: read

# Выкатки идут по очереди: новая ждёт, а не обрывает начатую.
concurrency:
  group: server
  cancel-in-progress: false

jobs:
  deploy:
    name: Тесты и выкатка
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run server:check

      - if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Нет секретов Cloudflare — выкатка пропущена"

      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run server:deploy
